<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">ServeSync use case diagram for the five tested use cases</title>
  <desc id="d">Three actors drawn as stick figures (FOH Staff, Manager, Administrator) connected to five use cases inside the ServeSync system boundary.</desc>
  <rect width="920" height="660" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="290" y="50" width="340" height="570" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="78" text-anchor="middle" font-weight="bold" font-size="16">ServeSync</text>

  <!-- Associations (drawn first so the ovals sit on top of the line ends) -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <!-- FOH Staff -->
    <line x1="140" y1="170" x2="320" y2="130"/>
    <line x1="140" y1="170" x2="320" y2="235"/>
    <!-- Manager -->
    <line x1="140" y1="420" x2="320" y2="130"/>
    <line x1="140" y1="420" x2="320" y2="235"/>
    <line x1="140" y1="420" x2="320" y2="340"/>
    <line x1="140" y1="420" x2="320" y2="445"/>
    <!-- Administrator -->
    <line x1="780" y1="340" x2="600" y2="130"/>
    <line x1="780" y1="340" x2="600" y2="340"/>
    <line x1="780" y1="340" x2="600" y2="445"/>
    <line x1="780" y1="340" x2="600" y2="550"/>
  </g>

  <!-- Use cases -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.5">
    <ellipse cx="460" cy="130" rx="140" ry="40"/>
    <ellipse cx="460" cy="235" rx="140" ry="40"/>
    <ellipse cx="460" cy="340" rx="140" ry="40"/>
    <ellipse cx="460" cy="445" rx="140" ry="40"/>
    <ellipse cx="460" cy="550" rx="140" ry="40"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="460" y="126">UC-01 Log in and</text>
    <text x="460" y="144">track shift time</text>
    <text x="460" y="231">UC-02 Manage customer</text>
    <text x="460" y="249">dining orders</text>
    <text x="460" y="336">UC-05 Procure supplies and</text>
    <text x="460" y="354">manage purchase orders</text>
    <text x="460" y="441">UC-11 Record</text>
    <text x="460" y="459">inventory spoilage</text>
    <text x="460" y="546">UC-08 Administer</text>
    <text x="460" y="564">user accounts</text>
  </g>

  <!-- Actors (stick figures) -->
  <g stroke="#000000" stroke-width="1.8" fill="#ffffff" stroke-linecap="round">
    <!-- FOH Staff -->
    <circle cx="110" cy="136" r="13"/>
    <line x1="110" y1="149" x2="110" y2="186"/>
    <line x1="88" y1="162" x2="132" y2="162"/>
    <line x1="110" y1="186" x2="92" y2="216"/>
    <line x1="110" y1="186" x2="128" y2="216"/>
    <!-- Manager -->
    <circle cx="110" cy="386" r="13"/>
    <line x1="110" y1="399" x2="110" y2="436"/>
    <line x1="88" y1="412" x2="132" y2="412"/>
    <line x1="110" y1="436" x2="92" y2="466"/>
    <line x1="110" y1="436" x2="128" y2="466"/>
    <!-- Administrator -->
    <circle cx="810" cy="306" r="13"/>
    <line x1="810" y1="319" x2="810" y2="356"/>
    <line x1="788" y1="332" x2="832" y2="332"/>
    <line x1="810" y1="356" x2="792" y2="386"/>
    <line x1="810" y1="356" x2="828" y2="386"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="110" y="238">FOH Staff</text>
    <text x="110" y="488">Manager</text>
    <text x="810" y="408">Administrator</text>
  </g>
</svg>

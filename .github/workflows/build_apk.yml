name: Build ServeSync Android APK

on:
  push:
    branches: [ main, droid-version ]
    # Only rebuild/re-release the APK when the app (or this workflow) changes;
    # backend-only commits deploy to Railway and shouldn't touch the release.
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/ServeSync-v1.1.0.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServeSync-v1.1.0-APK
          path: release-output/ServeSync-v1.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/droid-version'
        with:
          tag_name: v1.1.0-sprint4
          name: "ServeSync v1.1.0 (Sprint 4 Android Release)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ServeSync Android Release (Sprint 4)
            Download `ServeSync-v1.1.0.apk` below and install directly on Android.

            ### New in v1.1.0
            - App now signs in through the ServeSync REST API on Railway (MySQL): PIN login, clock in/out, inventory, spoilage logging, and supplier purchase orders read and write live cloud data
            - Cloud / Offline badge in the header; if the cloud is unreachable the app falls back to offline demo data
            - Demo accounts are now the Group 1 team: Salem Marye (Admin, 1234), Kristian Napier (Manager, 2345), Jamal Ford (3456), Sneha Patel (4567), Mason Mathias (5678)

            ### Fixes since v1.0.0
            - Theme picker on the login screen applies the new colors immediately
            - Seat Party sheet: party size is set manually (defaults to 2, capped at table capacity)
            - POS cart: seat badge cycles Seat 1..N -> Shared, where N is the seated party size
          files: release-output/ServeSync-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ServeSync Android APK

on:
  push:
    branches: [ main, droid-version ]
    # Only rebuild/re-release the APK when the app (or this workflow) changes;
    # backend-only commits deploy to Railway and shouldn't touch the release.
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/ServeSync-v1.2.0.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServeSync-v1.2.0-APK
          path: release-output/ServeSync-v1.2.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/droid-version'
        with:
          tag_name: v1.2.0-sprint4
          name: "ServeSync v1.2.0 (Sprint 4: all twelve features)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ServeSync Android Release v1.2.0 (Sprint 4)
            Download `ServeSync-v1.2.0.apk` below and install directly on Android.
            The same build runs in the browser at https://jamalford.github.io/ServeSync/

            ### New in v1.2.0
            - **Manage tab** with six modules: Reservations, Customer Service, Suppliers, User Accounts, Payroll, and Hiring
            - **Reservations**: book, edit, seat, cancel, and mark no-shows; double bookings and oversize parties are refused
            - **Orders are saved to the cloud database**; stock is deducted by recipe, and the kitchen display shows the same tickets on every device
            - **AI Copilot uses live data**: consumption forecast with days of stock left and a one-tap purchase order, and a customer review summary
            - **Inventory**: add and edit items, adjust stock with a reason, cancel a pending purchase order
            - **Payroll**: pay rate per employee, shift adjustments with a reason, mark shifts as paid
            - **Hiring**: applicant stages, notes, a Hire action that creates the staff account, onboarding status
            - Floor plan and menu fit wide screens; seat choices follow the party size

            ### Changed
            - Firebase is no longer used. All data goes through the ServeSync REST API on Railway (MySQL).
          files: release-output/ServeSync-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
